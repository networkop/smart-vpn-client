name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Go and golangci-lint versions are pinned exactly (not "stable"/"latest")
# and kept in sync across both jobs. Floating either one independently has
# repeatedly broken the lint job: golangci-lint's export-data decoder (via
# its pinned x/tools) and whatever Go version produces that export data
# must agree on the export format version, and that compatibility window
# is not guaranteed to track "whatever is newest today" on either side.
# Bump GO_VERSION/GOLANGCI_LINT_VERSION together, deliberately, and confirm
# `make lint` passes locally with that exact pair before pushing.
env:
  GO_VERSION: '1.26.3'
  GOLANGCI_LINT_VERSION: 'v1.64.8'

jobs:
  # Linting is in a separate job because golangci-lint is quite slow when
  # running it in cold-start mode.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Built from source, pinned to the exact tag above and compiled with
      # the exact Go version above, so the pairing is deterministic instead
      # of "whatever @latest and stable happen to resolve to today".
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - name: Run linter via Makefile
        run: make lint

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test
