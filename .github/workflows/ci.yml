name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Linting is in a separate job because golangci-lint is quite slow when
  # running it in cold-start mode.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # golangci-lint-action downloads a matched prebuilt release binary
      # instead of `go install`-ing from source against whatever toolchain
      # happens to be active. `go install @latest` can resolve a release
      # built against an older x/tools that only decodes export-data format
      # v2, while a newer Go toolchain emits v4 — producing:
      #   "export data version 4 is greater than maximum supported version 2"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Matches go.mod's `go 1.26` directive; a lower pinned version here
      # relies on Go's toolchain auto-switch to silently fetch 1.26 anyway.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make test
